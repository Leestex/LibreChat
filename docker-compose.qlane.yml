# qlane test target: builds LibreChat from source in an ephemeral sandbox.
# Sandboxes are discarded after each run and unreachable externally.
# Docs: https://docs.qlane.ai/connect/docker-compose

services:
  api:
    image: librechat-pr:qlane
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_MAX_OLD_SPACE_SIZE: 6144
    ports:
      - "3080:3080"
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      # Written by qlane from .env.example plus any variables configured on the test target
      # (e.g. OPENAI_API_KEY); the overrides below win over it.
      - path: .env
        required: false
    environment:
      - HOST=0.0.0.0
      - PORT=3080
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - DOMAIN_CLIENT=${QLANE_SANDBOX_PUBLIC_URL:-http://localhost:3080}
      - DOMAIN_SERVER=${QLANE_SANDBOX_PUBLIC_URL:-http://localhost:3080}
      - SEARCH=false
      - ALLOW_EMAIL_LOGIN=true
      - ALLOW_REGISTRATION=true
      - ALLOW_UNVERIFIED_EMAIL_LOGIN=true
      # Credential-free chat: the "Mock LLM" endpoint is answered in-process by the e2e fake model.
      # Hide the built-in provider endpoints (.env.example marks them user_provided) so the
      # custom "Mock LLM" endpoint is the first and default choice, with agents still available.
      - ENDPOINTS=custom,agents
      - CONFIG_PATH=/app/e2e/config/librechat.qlane.yaml
      - LIBRECHAT_TEST_RUN_HOOK=/app/e2e/setup/fake-model.js
      - MOCK_LLM_REPLY=Hello from the mock LLM.
      # CREDS_KEY, CREDS_IV, JWT_SECRET and JWT_REFRESH_SECRET are left unset on purpose:
      # bootstrapCredentials generates temporary values inside the ephemeral container.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    labels:
      ai.qlane.postdeploy: "npm run create-user -- qa@example.com QATester qa qlane-test-password --email-verified=true"

  mongodb:
    image: mongo:8.0.20
    command: mongod --noauth
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
